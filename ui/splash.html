  <script>
    const img = document.getElementById("splashImg");
    // The whole fade in -> hold -> fade out sequence is driven here, anchored
    // to the real image-load event, rather than timed from the Python side —
    // decoding this (fairly large, base64-embedded) image can itself take a
    // variable moment, so Python guessing "it must be done by now" on a fixed
    // clock was racing ahead of the actual fade-in.
    function sequence() {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        img.classList.add("show");
        setTimeout(() => img.classList.remove("show"), 1900); // hold after fade-in, then fade out
      }));
    }
    if (img.complete) {
      sequence();
    } else {
      img.addEventListener("load", sequence);
    }
  </script>
